# XcodeGen spec: `xcodegen generate` writes Chat.xcodeproj (not committed).
name: Chat
options:
  bundleIdPrefix: chat.beacon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Chat:
    type: application
    platform: iOS
    sources: [Chat]
    dependencies:
      - target: NotificationService
    entitlements:
      path: Chat/Chat.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.chat.beacon.ios]
    info:
      path: Chat/Info.plist
      properties:
        CFBundleDisplayName: Chat
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Real servers are https. Local networking allows http://localhost for development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: chat.beacon.invite
            CFBundleURLSchemes: [chat]
        # The push relay this build uses (apps/push-relay); empty turns push off.
        ChatPushRelay: $(CHAT_PUSH_RELAY)
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        CHAT_PUSH_RELAY: ""
        PRODUCT_BUNDLE_IDENTIFIER: chat.beacon.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - Chat/Shared
    entitlements:
      path: NotificationService/NotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.chat.beacon.ios]
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: Chat Notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: chat.beacon.ios.notifications
        CODE_SIGN_STYLE: Automatic

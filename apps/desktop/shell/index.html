<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Chat</title>
    <link rel="stylesheet" href="shell.css" />
  </head>
  <body>
    <main class="card">
      <div class="header">
        <img src="icon.svg" alt="" class="logo" />
        <div>
          <h1>Connect to your server</h1>
          <p class="subtitle">Enter the address you use for Chat in your browser.</p>
        </div>
      </div>
      <form id="form" novalidate>
        <div class="field">
          <label for="server">Server address</label>
          <input id="server" name="server" type="text" inputmode="url" autocomplete="url" autocapitalize="off" spellcheck="false" placeholder="chat.example.com" required autofocus />
        </div>
        <p id="error" role="alert" hidden></p>
        <button id="connect" type="submit">Connect</button>
      </form>
      <p class="hint">Don't have a server? Anyone can run one on Cloudflare in a few minutes. Ask whoever invited you for the address.</p>
    </main>
    <script src="shell.js"></script>
  </body>
</html>
